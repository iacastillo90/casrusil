.alert.t-warning { border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
.alert.t-destructive { border-color: color-mix(in srgb, var(--destructive) 30%, transparent); }
.alert.t-success { border-color: color-mix(in srgb, var(--success) 30%, transparent); }

/* Estados vacío / error / cargando */
.state-box { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 48px 24px; }
.state-box .s-icon { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--muted); color: var(--muted-foreground); margin-bottom: 4px; }
.state-box.err .s-icon { background: var(--destructive-subtle); color: var(--destructive-subtle-foreground); }
.state-box.lock .s-icon { background: var(--warning-subtle); color: var(--warning-subtle-foreground); }
.state-box p { color: var(--muted-foreground); max-width: 60ch; }
.state-box .row { margin-top: 8px; justify-content: center; }
details.tech { margin-top: 8px; font-size: var(--text-xs); color: var(--muted-foreground); }
.sk { background: linear-gradient(90deg, var(--muted) 25%, var(--accent) 37%, var(--muted) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: var(--radius-sm); }
@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* Stepper */
.stepper { display: flex; gap: 0; list-style: none; padding: 0; margin: 0 0 20px; counter-reset: step; }
.stepper li { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; position: relative; padding-right: 12px; }
.stepper li::after { content: ""; flex: 1; height: 2px; background: var(--border); min-width: 12px; }
.stepper li:last-child::after { display: none; }
.stepper li.done::after { background: var(--primary); }
.step-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--text-xs); border: 2px solid var(--input); color: var(--muted-foreground); background: var(--card); flex-shrink: 0; }
.stepper li.current .step-dot { border-color: var(--primary); color: var(--primary); }
.stepper li.done .step-dot { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.stepper li.warn .step-dot { background: var(--warning-subtle); border-color: var(--warning); color: var(--warning-subtle-foreground); }
.stepper li.error .step-dot { background: var(--destructive-subtle); border-color: var(--destructive); color: var(--destructive-subtle-foreground); }
.step-text { display: flex; flex-direction: column; min-width: 0; line-height: 16px; }
.step-text strong { font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-text span { font-size: var(--text-xs); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper li.current .step-text strong { color: var(--foreground); }
@media (max-width: 760px) { .stepper { flex-direction: column; gap: 8px; } .stepper li::after { display: none; } }

/* Recorrido del documento tributario (elemento distintivo) */
.dte-track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative; padding: 18px 16px 16px; }
.dte-stage { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding-right: 12px; }
.dte-stage::before { content: ""; position: absolute; top: 15px; left: 34px; right: 0; height: 3px; border-radius: 3px; background: var(--border); }
.dte-stage:last-child::before { display: none; }
.dte-stage.reached::before { background: var(--primary); }
.dte-node { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--input); color: var(--muted-foreground); position: relative; z-index: 1; }
.dte-stage.reached .dte-node { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.dte-stage.now .dte-node { box-shadow: 0 0 0 4px var(--primary-subtle); }
.dte-stage.res-ok .dte-node { background: var(--success-solid); border-color: var(--success-solid); color: var(--success-solid-foreground); }
.dte-stage.res-warn .dte-node { background: var(--warning-solid); border-color: var(--warning-solid); color: var(--warning-solid-foreground); }
.dte-stage.res-bad .dte-node { background: var(--destructive-solid); border-color: var(--destructive-solid); color: var(--destructive-solid-foreground); }
.dte-stage.res-cancel .dte-node { background: var(--neutral-subtle); border-color: var(--input); color: var(--neutral-subtle-foreground); }
.dte-stage strong { font-size: var(--text-sm); }
.dte-stage span { font-size: var(--text-xs); color: var(--muted-foreground); }
@media (max-width: 760px) { .dte-track { grid-template-columns: 1fr 1fr; row-gap: 16px; } .dte-stage::before { display: none; } }

.doc-paper { background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-sm); max-width: 820px; }
.doc-paper .muted { color: #475569; }
.doc-top { display: flex; gap: 24px; justify-content: space-between; align-items: flex-start; }
.doc-folio { border: 3px solid #b91c1c; color: #b91c1c; padding: 10px 18px; text-align: center; font-weight: 700; min-width: 220px; line-height: 22px; }
.doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; margin: 20px 0; padding: 14px 0; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
.doc-paper table { width: 100%; border-collapse: collapse; }
.doc-paper th { text-align: left; font-size: 12px; color: #475569; border-bottom: 1px solid #cbd5e1; padding: 6px 4px; }
.doc-paper td { padding: 6px 4px; border-bottom: 1px solid #f1f5f9; }
.doc-bottom { display: flex; justify-content: space-between; gap: 24px; margin-top: 20px; align-items: flex-end; }
.timbre { width: 280px; }
.timbre-code { height: 64px; background: repeating-linear-gradient(90deg, #0f172a 0 2px, #fff 2px 3px, #0f172a 3px 4px, #fff 4px 7px, #0f172a 7px 8px, #fff 8px 10px); border: 1px solid #0f172a; }

.doc-totals { min-width: 260px; }
.doc-totals div { display: flex; justify-content: space-between; padding: 3px 0; font-variant-numeric: tabular-nums; }
.doc-totals .grand { border-top: 2px solid #0f172a; margin-top: 4px; padding-top: 6px; font-weight: 700; font-size: 16px; }

.totals { display: grid; gap: 6px; min-width: 280px; }

.timeline li::before { content: ""; position: absolute; left: 13px; top: 26px; bottom: 0; width: 2px; background: var(--border); }
.timeline li:last-child::before { display: none; }

/* Medidor de folios */
.meter { height: 10px; border-radius: 999px; background: var(--muted); overflow: hidden; display: flex; }

.meter .avail { background: var(--primary); }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--text-xs); color: var(--muted-foreground); }

.dialog-back { position: fixed; inset: 0; background: var(--overlay); z-index: 90; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--popover); color: var(--foreground); border-radius: 12px; box-shadow: var(--shadow-lg); width: 100%; max-width: 520px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; border: 1px solid var(--border); }
.dialog.wide { max-width: 760px; }
.dialog-head { padding: 18px 20px 6px; display: flex; gap: 12px; align-items: flex-start; }
.dialog-head h2 { flex: 1; font-size: var(--text-lg); }
.dialog-body { padding: 8px 20px 16px; overflow-y: auto; }
.dialog-body > p + p { margin-top: 8px; }
.dialog-foot { padding: 12px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.drawer-back { position: fixed; inset: 0; background: var(--overlay); z-index: 90; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--popover); border-left: 1px solid var(--border); z-index: 91; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.drawer-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.drawer-head h2 { flex: 1; font-size: var(--text-base); }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
.drawer-foot { border-top: 1px solid var(--border); padding: 12px 16px; }

/* Menú desplegable */
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 75; background: var(--popover); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); min-width: 320px; padding: 6px; }
.menu-pop .mi { display: flex; gap: 10px; padding: 8px 10px; border-radius: var(--radius-md); text-decoration: none; color: var(--foreground); align-items: flex-start; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
.menu-pop .mi:hover { background: var(--accent); }
.rel { position: relative; }

.cmd-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 360px; overflow-y: auto; }
.cmd-list a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--radius-md); color: var(--foreground); text-decoration: none; }
.cmd-list a:hover, .cmd-list a.sel { background: var(--accent); }
.cmd-list .cmd-area { margin-left: auto; font-size: var(--text-xs); color: var(--muted-foreground); }

/* Chat IA */
.chat-msg { padding: 10px 12px; border-radius: var(--radius-lg); max-width: 92%; }
.chat-msg.me { background: var(--primary-subtle); color: var(--primary-subtle-foreground); align-self: flex-end; }
.chat-msg.bot { background: var(--muted); }
.chat-src { font-size: var(--text-xs); color: var(--muted-foreground); margin-top: 6px; }

.toasts { position: fixed; right: 16px; bottom: calc(var(--ctrl-h) + 16px); z-index: 95; display: flex; flex-direction: column; gap: 8px; }

.toast.t-bad { border-left-color: var(--destructive); }

.ctrlbar {

.ic.up-arrow { transform: rotate(180deg); }

/* Ajustes tras la revisión visual */

.search-btn svg, .nav-item svg, .btn svg { flex-shrink: 0; }
.deadline { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; color: inherit; text-decoration: none; }
.deadline .money { white-space: nowrap; }
.proto-banner .long { font-weight: 500; }
@media (max-width: 760px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .k-value { font-size: var(--text-xl); line-height: 28px; }
  .proto-banner .long { display: none; }
  .company { display: none; }
  .ctrlbar { overflow-x: auto; gap: 10px; }
  .ctrlbar .cb-title { display: none; }
  .page-head .actions { width: 100%; }
  .dte-track { padding: 14px; }
}
.toasts { top: calc(var(--banner-h) + var(--header-h) + 12px); bottom: auto; }
.ctrlbar button, .ctrlbar a, .ctrlbar label { white-space: nowrap; flex-shrink: 0; }
.nav-sub .nav-item { font-weight: 500; }
.toasts, .toast { pointer-events: none; }

  // ---------- Gráfico de barras agrupadas (SVG) ----------
  function barChart(data, series, o) {
    o = o || {};
    var W = 560, H = 200, pl = 36, pb = 24, pt = 10;
    var max = 0; data.forEach(function (d) { series.forEach(function (s) { max = Math.max(max, d[s.key]); }); });
    max = Math.ceil(max / 10) * 10 || 10;
    var gw = (W - pl) / data.length, bw = Math.min(22, (gw - 12) / series.length);
    var parts = [];
    for (var g = 0; g <= 4; g++) { var y = pt + (H - pt - pb) * g / 4; parts.push('<line class="gridline" x1="' + pl + '" x2="' + W + '" y1="' + y + '" y2="' + y + '"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + Math.round(max * (1 - g / 4)) + '</text>'); }
    data.forEach(function (d, i) {
      var x0 = pl + i * gw + (gw - bw * series.length - 4 * (series.length - 1)) / 2;
      series.forEach(function (s, j) {
        var h = (H - pt - pb) * d[s.key] / max;
        parts.push('<rect x="' + (x0 + j * (bw + 4)) + '" y="' + (H - pb - h) + '" width="' + bw + '" height="' + h + '" rx="3" fill="var(' + s.color + ')"><title>' + U.esc(d.m + ', ' + s.label + ': ' + d[s.key] + (o.unit || '')) + '</title></rect>');
      });
      parts.push('<text x="' + (pl + i * gw + gw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + U.esc(d.m) + '</text>');
    });
    var desc = data.map(function (d) { return d.m + ': ' + series.map(function (s) { return s.label + ' ' + d[s.key] + (o.unit || ''); }).join(', '); }).join('; ');
    return html`<figure style="margin:0"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title || 'Gráfico'}. ${desc}">${raw(parts.join(''))}</svg>

  }

      { key: 'SIGNED', label: 'Firmado', ic: 'fileSignature', sub: when('SIGNED') || (idx >= 1 ? 'Con certificado' : 'Pendiente') },

    ];
    return html`<div class="card"><div class="dte-track" aria-label="Recorrido del documento">${stages.map(function (s, i) {
      var reached = i < idx || (i === idx && i < 3);
      var cls = (i < idx ? 'reached' : '') + (i === idx && i < 3 ? ' now reached' : '') + (i === 3 && resolved ? ' ' + resolved[0] : '');
      return html`<div class="dte-stage ${cls}"><span class="dte-node">${icon(s.ic, 16)}</span><strong>${s.label}</strong><span>${s.sub}</span>${i === idx && i < 3 ? html`<span class="sr-only">(etapa actual)</span>` : ''}</div>`;

  }

  <script>
/* Núcleo del prototipo: estado, router por hash, shell, barra de control, diálogos y eventos. */
(function () {
  'use strict';
  var U = window.U, C = window.C, D = window.D, REG = window.REG, html = U.html, icon = U.icon, raw = U.raw;
  var V = window.V = window.V || {};      // vistas por id de pantalla
  var A = window.A = window.A || {};      // acciones de clic (data-action)
  var CH = window.CH = window.CH || {};   // acciones de cambio (data-action-change)

  // ---------- Estado ----------
  var KEY = 'proto-siierp-v2';
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
  var mods = {}; REG.MODULES.forEach(function (m) { mods[m[0]] = true; });
  var S = window.S = {
    role: saved.role || 'ADMIN',
    modules: saved.modules || mods,
    theme: saved.theme || 'light',
    screenState: saved.screenState || 'datos',
    collapsed: !!saved.collapsed,
    env: saved.env || 'cert',
    openGroups: saved.openGroups || { 'g-sales': true, 'g-tax': true },
    tables: {}, tabs: {}, wiz: {}, ui: {},
    pop: null, flyout: null, dialog: null, drawer: null, mobileOpen: false
  };
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ role: S.role, modules: S.modules, theme: S.theme, screenState: S.screenState, collapsed: S.collapsed, env: S.env, openGroups: S.openGroups })); } catch (e) { /* almacenamiento no disponible */ }
  }

  // ---------- Router ----------
  var MEM = document.documentElement.getAttribute('data-router') === 'memory';
  var memRoute = null;
  function currentRoute() { return MEM ? (memRoute || '/') : (location.hash.replace(/^#/, '') || '/'); }
  function parseHash() {
    var h = currentRoute();
    var qi = h.indexOf('?'), path = qi >= 0 ? h.slice(0, qi) : h, query = {};
    if (qi >= 0) h.slice(qi + 1).split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) query[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
    if (path.length > 1) path = path.replace(/\/$/, '');
    return { path: path, query: query };
  }
  function match(path) {
    var exact = REG.SCREENS.filter(function (s) { return s.route === path; })[0];
    if (exact) return { sc: exact, params: {} };
    for (var i = 0; i < REG.SCREENS.length; i++) {
      var s = REG.SCREENS[i];
      if (s.route.indexOf(':') < 0) continue;
      var a = s.route.split('/'), b = path.split('/');
      if (a.length !== b.length) continue;
      var params = {}, ok = true;
      for (var j = 0; j < a.length; j++) {
        if (a[j].charAt(0) === ':') params[a[j].slice(1)] = decodeURIComponent(b[j]);
        else if (a[j] !== b[j]) { ok = false; break; }
      }
      if (ok) return { sc: s, params: params };
    }
    return null;
  }
  function go(path) {
    if (MEM) { memRoute = path; render(); return; }
    if (location.hash === '#' + path) render(); else location.hash = '#' + path;
  }
  // Reemplaza la ruta actual sin volver a renderizar (equivale a history.replaceState)
  function replaceRoute(path) { if (MEM) { memRoute = path; lastPath = path; } else { history.replaceState(null, '', '#' + path); } }

  // ---------- Utilidades de render ----------
  function roleLabel() { return REG.ROLE_LABEL[S.role]; }
  function userInfo() { return REG.USERS_BY_ROLE[S.role] || ['Usuario', 'U']; }
  function visibleNav() {
    return REG.NAV.map(function (g) {
      var items = g.items.map(function (id) { return REG.BY_ID[id]; }).filter(function (sc) {
        return REG.canAccess(sc, S.role) && (!sc.module || S.modules[sc.module]);
      });
      return { g: g, items: items };
    }).filter(function (x) { return x.items.length; });
  }
  function activeNavId(sc) { return sc.navParent || sc.id; }

  function sidebar(sc) {
    var active = activeNavId(sc);
    var groups = visibleNav();
    var navHtml = groups.map(function (x) {
      var g = x.g, hasActive = x.items.some(function (i) { return i.id === active; });
      if (g.flat && x.items.length === 1) {
        var it = x.items[0];
        return html`<div class="nav-section"><a class="nav-item" href="#${it.route}" ${it.id === active ? raw('aria-current="page"') : ''} title="${S.collapsed ? g.label : ''}">${icon(g.icon, 18)}<span class="nav-label">${REG.NAV_LABEL[it.id] || it.title}</span></a></div>`;
      }
      var open = S.openGroups[g.id] !== undefined ? S.openGroups[g.id] : hasActive;
      return html`<div class="nav-section">
        <button type="button" class="nav-group-btn ${hasActive ? 'has-active' : ''}" aria-expanded="${S.collapsed ? 'false' : String(!!open)}" ${S.collapsed ? raw('aria-haspopup="true"') : raw('aria-controls="sub-' + g.id + '"')} data-action="${S.collapsed ? 'flyout' : 'nav-toggle'}" data-group="${g.id}" title="${S.collapsed ? g.label : ''}">
          ${icon(g.icon, 18)}<span class="nav-label">${g.label}</span>${icon('chevRight', 14, 'chev')}
        </button>
        ${open && !S.collapsed ? html`<div class="nav-sub" id="sub-${g.id}">${x.items.map(function (it) {
          return html`<a class="nav-item" href="#${it.route}" ${it.id === active ? raw('aria-current="page"') : ''}><span class="nav-label">${REG.NAV_LABEL[it.id] || it.title}</span>${it.dev === 'planificado' ? html`<span class="nav-badge" title="Planificado">Nuevo</span>` : ''}</a>`;
        })}</div>` : ''}
      </div>`;
    });
    var flyout = '';
    if (S.collapsed && S.flyout) {
      var fg = groups.filter(function (x) { return x.g.id === S.flyout.id; })[0];
      if (fg) flyout = html`<div class="nav-flyout" role="menu" aria-label="${fg.g.label}" style="left:68px;top:${S.flyout.top}px"><h4>${fg.g.label}</h4>${fg.items.map(function (it) {
        return html`<a class="nav-item" role="menuitem" href="#${it.route}" ${it.id === active ? raw('aria-current="page"') : ''} data-action="flyout-close"><span class="nav-label" style="display:inline">${REG.NAV_LABEL[it.id] || it.title}</span></a>`;
      })}</div>`;
    }
    return html`<aside class="sidebar" aria-label="Navegación principal">
      <div class="brand"><span class="brand-mark">${icon('landmark', 16)}</span><span class="brand-name">SII-ERP <span>AI</span></span></div>
      <nav class="nav">${groups.length ? navHtml : html`<p class="muted small" style="padding:8px">Tu rol no tiene áreas asignadas.</p>`}</nav>
      <div class="sidebar-foot">
        <button type="button" class="nav-item" data-action="collapse" aria-label="${S.collapsed ? 'Expandir menú' : 'Contraer menú'}">${icon(S.collapsed ? 'chevsRight' : 'chevsLeft', 18)}<span class="nav-label">Contraer menú</span></button>
      </div>
    </aside>${flyout}`;
  }

  function header() {
    var u = userInfo();
    var unread = D.notifications.length;
    return html`<header class="header">
      <button type="button" class="icon-btn only-mobile" aria-label="Abrir menú" data-action="mobile-menu">${icon('menu', 20)}</button>
      <div class="company"><strong>${D.company.name}</strong><span>RUT ${D.company.rut}</span></div>
      <span class="env-pill ${S.env === 'cert' ? 'env-cert' : 'env-prod'}" title="${S.env === 'cert' ? 'Los documentos se envían al ambiente de pruebas del SII y no tienen validez tributaria.' : 'Los documentos enviados tienen validez tributaria y consumen folios reales.'}">${icon(S.env === 'cert' ? 'shield' : 'alert', 13)}${S.env === 'cert' ? 'SII: certificación' : 'SII: producción'}</span>
      <span class="header-spacer"></span>
      <button type="button" class="search-btn" data-action="cmd-open" aria-keyshortcuts="Control+K">${icon('search', 15)}<span class="lbl">Buscar pantallas y acciones</span><kbd>Ctrl K</kbd></button>
      <button type="button" class="btn btn-outline btn-sm hide-mobile" data-action="ai-open">${icon('sparkles', 15)}Asistente</button>
      <div class="rel">
        <button type="button" class="icon-btn" aria-label="Notificaciones (${unread} sin leer)" aria-expanded="${S.pop === 'notif'}" data-action="pop" data-pop="notif">${icon('bell', 18)}${unread ? html`<span class="dot"></span>` : ''}</button>
        ${S.pop === 'notif' ? html`<div class="menu-pop" role="dialog" aria-label="Notificaciones">${D.notifications.map(function (n) {
          return html`<a class="mi" href="${n.link}" data-action="pop-close"><span class="badge t-${n.tone}" style="height:28px;width:28px;padding:0;justify-content:center">${icon(n.icon, 14)}</span><span><strong style="display:block">${n.title}</strong><span class="small muted">${n.body}</span></span></a>`;
        })}<div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><a class="mi" href="#/notifications" data-action="pop-close">Ver todas las notificaciones</a></div></div>` : ''}

    if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'k' || ev.key === 'K')) { ev.preventDefault(); A['cmd-open'](); return; }

      if (ev.key === 'ArrowUp') { ev.preventDefault(); S.ui.cmdSel = Math.max(0, (S.ui.cmdSel || 0) - 1); App.refreshOverlay(); }

    }
  });

  window.addEventListener('DOMContentLoaded', render);

  <script>
/* Ventas y compras: facturas (lista, emisión, detalle), cotizaciones, oportunidades, órdenes de compra y honorarios. */
(function () {

  // ======================= Emitir documento (flujo) =======================
  function initWiz(q) {
    var w = { step: 0, tipo: 33, rut: '', date: U.date(D.TODAY), term: '30', lines: [{ sku: 'HAR-025', desc: 'Harina especial 25 kg', qty: 10, price: 18900, exempt: false }], ref: '', motivo: 'Anula documento', errors: {} };

      var f = D.invById(q.from);

      if (qt) { w.rut = D.party(qt.party).rut; w.fromQuote = qt.id; w.lines = [{ sku: 'CAF-001', desc: 'Café en grano 1 kg', qty: Math.round(qt.total / 1.19 / 15990), price: 15990, exempt: false }]; }

  function validate(w, step) {

          <datalist id="clientes-rut">${D.parties.filter(function (x) { return x.kind === 'Cliente'; }).map(function (x) { return html`<option value="${x.rut}">${x.name}</option>`; })}</datalist>
          ${w.errors.rut && w.rut && U.validRut(w.rut) ? html`<span class="small" style="color:var(--destructive)">${w.errors.rut}</span>` : ''}
          ${w.errors.rut && !w.rut ? html`<span class="small" style="color:var(--destructive)">${w.errors.rut}</span>` : ''}

            ${C.field('Documento de referencia', C.select('w-ref', [['', 'Elige un documento']].concat(D.invoices.filter(function (i) { return (i.status === 'ACCEPTED' || i.status === 'ACCEPTED_WITH_OBJECTIONS') && i.tipo === 33; }).map(function (i) { return [i.id, docName(i) + ', ' + D.party(i.party).name]; })), w.ref, { attrs: 'data-bind="wiz.inv.ref" data-rerender' }), { id: 'w-ref', req: true, err: w.errors.ref })}
            ${C.field('Motivo', C.select('w-mot', ['Anula documento', 'Corrige montos', 'Corrige texto'], w.motivo, { attrs: 'data-bind="wiz.inv.motivo"' }), { id: 'w-mot' })}
          </div>` : ''}

  <script>
/* Tributario (SII): salud tributaria, F29, folios (CAF), sincronización y documentos recibidos. */
(function () {
  'use strict';
  var U = window.U, C = window.C, D = window.D, html = U.html, icon = U.icon, raw = U.raw, V = window.V, A = window.A, CH = window.CH, S = window.S;

  // Cifras del F29 de octubre 2026 (ficticias, coherentes entre pantallas)
  var ventas = 51800120, debito = Math.round(ventas * 0.19), credito = 4211830, ppm = Math.round(ventas * 0.0025);
  var retHon = D.fees.filter(function (f) { return f.date < '2026-11-01'; }).reduce(function (s, f) { return s + f.ret; }, 0);
  var F29 = { ventas: ventas, debito: debito, credito: credito, iva: debito - credito, ppm: ppm, ret: retHon, total: debito - credito + ppm + retHon };
  window.F29 = F29;

  function tipoName(t) { return D.TIPOS[t]; }
  function cafSummary() {
    var tipos = [33, 34, 39, 52, 56, 61];
    return tipos.map(function (t) {
      var list = D.cafs.filter(function (c) { return c.tipo === t; });
      var total = list.reduce(function (s, c) { return s + (c.to - c.from + 1); }, 0), used = list.reduce(function (s, c) { return s + c.used; }, 0);
      return { tipo: t, total: total, used: used, avail: total - used };
    });
  }

  // ======================= Salud tributaria =======================
  V.compliance = function () {
    var cs = cafSummary(), f33 = cs[0];
    var sent = D.invoices.filter(function (i) { return i.status === 'SENT'; }).length;

      { tone: f33.avail < 100 ? 'warning' : 'success', ic: 'layers', t: f33.avail + ' folios de factura disponibles', d: 'Al ritmo de octubre alcanzan para unos 9 días.', a: C.btn('Ver folios', { size: 'sm', href: '#/sii/caf' }) },
      { tone: 'destructive', ic: 'layers', t: 'Sin folios de guía de despacho', d: 'No puedes emitir guías (tipo 52) hasta cargar un CAF.', a: C.btn('Cargar CAF', { size: 'sm', href: '#/sii/caf' }) },
      { tone: rej ? 'destructive' : 'success', ic: 'xCircle', t: rej + ' documento rechazado por el SII', d: 'Corrígelo y emítelo de nuevo para que tenga validez.', a: C.btn('Ver rechazados', { size: 'sm', href: '#/invoices' }) },
      { tone: sent ? 'info' : 'success', ic: 'hourglass', t: sent + ' documento sin respuesta del SII', d: 'El sistema aún no consulta el estado automáticamente (PLAN B-02).', a: C.btn('Ver documentos', { size: 'sm', href: '#/invoices' }) },
      { tone: 'warning', ic: 'scale', t: '3 facturas del RCV que no están en el ERP', d: 'Diferencia de ' + U.clp(2190400) + ' en compras de octubre.', a: C.btn('Ver en Auditoría', { size: 'sm', href: '#/accounting/audit?tab=mirror' }) },
      { tone: 'success', ic: 'key', t: 'Certificado digital vigente', d: 'Vence el 08-01-2027 (en 54 días).', a: C.btn('Ver certificado', { size: 'sm', href: '#/settings?tab=cert' }) }

  // ======================= Formulario 29 =======================
  V.f29 = function () {
    var w = S.wiz.f29 = S.wiz.f29 || { step: 0, period: '2026-10' };

      ['537', 'Total crédito fiscal', F29.credito],

  A['bank-auth'] = function () {
    S.ui.busy_bk = true; App.refreshOverlay();

      S.ui.busy_bk = false; var s = S.ui.bank; s.step = 2;

      else if (!D.banks.some(function (b) { return b.bank === s.bank; })) D.banks.push({ id: 'bk' + Date.now(), bank: s.bank, acc: 'Cuenta corriente ****' + String(Math.floor(Math.random() * 9000 + 1000)), balance: 7350200, sync: new Date().toISOString(), status: 'Conectada' });

  // ======================= Conciliación bancaria =======================
  V.reconciliation = function () {
    var w = S.wiz.rec = S.wiz.rec || { selB: null, selL: null, done: {}, ignored: {} };
    var pendB = D.bankMoves.filter(function (m) { return !w.done[m.id] && !w.ignored[m.id]; });
    var usedL = {}; Object.keys(w.done).forEach(function (k) { usedL[w.done[k]] = true; });
    var pendL = D.ledgerRecords.filter(function (r) { return !usedL[r.id]; });
    var total = D.bankMoves.length, ok = Object.keys(w.done).length + Object.keys(w.ignored).length;
    var suggestions = pendB.filter(function (m) { return m.match && !usedL[m.match]; });
    var selB = D.bankMoves.filter(function (m) { return m.id === w.selB; })[0], selL = D.ledgerRecords.filter(function (r) { return r.id === w.selL; })[0];
    var diff = selB && selL ? selB.amount - selL.amount : null;
    function item(x, side, sel, suggested) {
      return html`<button type="button" class="recon-item ${suggested ? 'suggested' : ''}" aria-pressed="${sel ? 'true' : 'false'}" data-action="rec-pick" data-side="${side}" data-id="${x.id}">

        </div>
        <div class="card card-pad row-between" style="position:sticky;bottom:calc(var(--ctrl-h) + 8px)" aria-live="polite">

        </div>` : html`<div class="card">${C.empty({ icon: 'checkCircle', title: 'Conciliación al día', text: 'Todos los movimientos del banco están conciliados o ignorados.' })}</div>`}

    else if (tab === 'remote') body = html`<div class="card card-pad stack" style="max-width:640px"><h2>Control remoto OCPP</h2><p class="muted">Envía órdenes a un cargador: reiniciar, desbloquear el conector, iniciar o detener una carga.</p>
      ${C.field('Cargador', C.select('oc-c', D.chargers.map(function (c) { return [c.id, c.name + ' (' + c.status + ')']; })), { id: 'oc-c' })}
      <div class="row">${C.btn('Reiniciar', { icon: 'refresh', action: 'ocpp', attrs: 'data-cmd="Reiniciar"' })}${C.btn('Desbloquear conector', { action: 'ocpp', attrs: 'data-cmd="Desbloquear conector"' })}${C.btn('Detener carga', { variant: 'destructive', action: 'ocpp', attrs: 'data-cmd="Detener carga"' })}</div></div>`;
    else body = html`<div class="card">${C.empty({ icon: { pricing: 'tag', maint: 'wrench', alerts: 'bell', reports: 'chart', models: 'plug' }[tab], title: tabs.filter(function (t) { return t.id === tab; })[0].label, text: 'El backend tiene ' + counts[tab] + ' endpoints para esta sección y ninguno se usa en el front (MAPA-FUNCIONAL §6). Se diseña si el módulo sigue en el producto (decisión D-05).' })}</div>`;
    return { subtitle: 'Red de cargadores eléctricos: estado, control y tarifas.', endpoint: '/api/v1/ocpp',
      body: html`<div class="stack">${C.alert('warning', 'Decisión pendiente', 'No está claro si Energía es parte de este producto, un producto aparte o código sin uso (DESIGN §13, decisión D-05). Tiene 70 endpoints; la pantalla actual llama a 4 que no existen.')}${C.tabs('energy', tabs, tab)}${body}</div>` };
  };
  A.ocpp = function (el) { var cmd = el.getAttribute('data-cmd'); App.confirm({ title: cmd, text: 'La orden se enviará al cargador por OCPP. Si hay una carga en curso, puede interrumpirse.', confirm: cmd, destructive: cmd === 'Detener carga', onConfirm: function () { App.toast('Orden "' + cmd + '" enviada.'); } }); };

  // ======================= Sostenibilidad =======================
  V.sustainability = function () {
    return { subtitle: 'Puntaje ambiental, compras sostenibles y reporte ESG.', endpoint: '/sustainability/score',
      actions: html`${C.btn('Simulador Corfo', { icon: 'calculator', action: 'toast', attrs: 'data-msg="Simulación: podrías postular a un cofinanciamiento de hasta $8.000.000."' })}${C.btn('Generar reporte ESG', { variant: 'primary', icon: 'download', action: 'toast', attrs: 'data-msg="Reporte ESG generado."' })}`,
      body: html`<div class="stack"><div class="grid g4">${C.kpi('Puntaje ESG', '72 / 100', '+6 desde septiembre', { tone: 'up', ic: 'trending' })}${C.kpi('Compras sostenibles', '38%', 'Del total de compras')}${C.kpi('Huella estimada', '14,2 t CO₂e', 'Último trimestre')}${C.kpi('Flota eléctrica', '2 de 3', 'Vehículos')}</div>
        <div class="card"><div class="card-head"><h2>Compras sostenibles por mes</h2></div><div class="card-body">${C.barChart([{ m: 'Jun', v: 24 }, { m: 'Jul', v: 27 }, { m: 'Ago', v: 31 }, { m: 'Sep', v: 33 }, { m: 'Oct', v: 38 }], [{ key: 'v', label: '% de compras sostenibles', color: '--chart-2' }], { unit: '%', title: 'Porcentaje de compras sostenibles por mes' })}</div></div></div>` };
  };

  // ======================= Configuración =======================
  function settingsView(ctx, forceTab) {
    var tab = forceTab || S.tabs.settings || ctx.query.tab || 'company';
    var c = D.company, body;
    if (tab === 'company') body = html`<div class="card card-pad stack" style="max-width:760px"><div class="grid g2">
        ${C.field('Razón social', C.input('co-n', c.name), { id: 'co-n', req: true })}${C.rutField('co-r', 'RUT de la empresa', c.rut, { req: true })}
        ${C.field('Giro', C.input('co-g', c.giro), { id: 'co-g' })}${C.field('Industria', C.select('co-i', ['Comercio mayorista', 'Comercio minorista', 'Manufactura', 'Servicios', 'Transporte', 'Energía'], c.industry), { id: 'co-i' })}
        ${C.field('Dirección', C.input('co-a', c.address), { id: 'co-a' })}${C.field('Email de contacto', C.input('co-e', c.email, { type: 'email' }), { id: 'co-e' })}</div>
        <div class="field"><span class="label">Logo</span><div class="row"><span class="brand-mark" style="width:48px;height:48px">${icon('landmark', 22)}</span>${C.btn('Cambiar logo', { size: 'sm', icon: 'upload', action: 'toast', attrs: 'data-msg="Logo actualizado."' })}</div></div>
        <div>${C.btn('Guardar cambios', { variant: 'primary', action: 'toast', attrs: 'data-msg="Perfil de la empresa guardado."' })}</div></div>`;
    else if (tab === 'users') body = html`<div class="stack">${C.alert('info', 'Gestión de usuarios y roles', 'Se diseña sobre /users y /roles, el sistema más completo del backend (recomendación de la decisión D-04). Eliminar usuario hoy falla: DELETE /sso/users/{id} no existe.')}
      ${C.dataTable({ id: 'usr', search: 'Buscar por nombre o email', searchKeys: ['name', 'email'], filters: [{ key: 'role', label: 'Rol', options: REG.ROLES.map(function (r) { return r; }) }, { key: 'status', label: 'Estado', options: ['Activo', 'Invitación pendiente', 'Suspendido'] }],
        toolbar: C.btn('Invitar usuario', { size: 'sm', variant: 'primary', icon: 'plus', action: 'user-invite' }),
        columns: [{ key: 'name', label: 'Usuario', render: function (r) { return html`<span class="cell-main">${r.name}</span><div class="cell-sub">${r.email}</div>`; } },
          { key: 'role', label: 'Rol', render: function (r) { return html`<label class="sr-only" for="ur-${r.id}">Rol de ${r.name}</label>${C.select('ur-' + r.id, REG.ROLES, r.role, { attrs: 'data-action-change="user-role" data-id="' + r.id + '" style="height:30px;width:auto"' })}`; } },
          { key: 'status', label: 'Estado', render: function (r) { return C.badge(r.status, r.status === 'Activo' ? 'success' : r.status === 'Suspendido' ? 'neutral' : 'warning'); } },
          { key: 'last', label: 'Último acceso', render: function (r) { return r.last ? U.dateTime(r.last) : '—'; } },
          { key: 'a', label: '', sort: false, render: function (r) { return html`<div class="row" style="flex-wrap:nowrap">${C.btn(r.status === 'Suspendido' ? 'Activar' : 'Suspender', { size: 'sm', variant: 'ghost', action: 'user-susp', attrs: 'data-id="' + r.id + '"' })}${C.btn('Eliminar', { size: 'sm', variant: 'ghost', action: 'user-del', attrs: 'data-id="' + r.id + '"' })}</div>`; } }], rows: D.users }, S.tables.usr)}
      <div class="card card-pad"><h3>Permisos por rol</h3><p class="muted small" style="margin:4px 0 8px">Resumen de la matriz rol × área (PLAN §3.2). El menú de cada usuario se construye con ella.</p>
        <div class="table-wrap"><table class="dt compact"><thead><tr><th scope="col">Área</th>${REG.ROLES.slice(0, 7).map(function (r) { return html`<th scope="col" style="text-align:center">${r[1]}</th>`; })}</tr></thead><tbody>
        ${REG.NAV.map(function (g) { return html`<tr><td>${g.label}</td>${REG.ROLES.slice(0, 7).map(function (r) { var n = g.items.filter(function (id) { return REG.canAccess(REG.BY_ID[id], r[0]); }).length; return html`<td style="text-align:center">${n === g.items.length ? html`<span aria-label="Acceso completo" title="Acceso completo">${icon('checkCircle', 16, 'up')}</span>` : n ? html`<span aria-label="Acceso parcial" title="Acceso parcial" class="small strong">${n}/${g.items.length}</span>` : html`<span aria-label="Sin acceso" class="muted">—</span>`}</td>`; })}</tr>`; })}
        </tbody></table></div></div></div>`;
    else if (tab === 'orgs') body = html`<div class="card card-pad stack" style="max-width:640px">${C.devTag({ dev: 'planificado', real: 'Solo backend', missing: 'El backend tiene /organizations/* (9 endpoints) para organizaciones jerárquicas, sin pantalla.', src: 'MAPA-FUNCIONAL.md §6' })}<h2>Organizaciones</h2><p class="muted">Agrupa empresas relacionadas (holding y filiales) para administrar usuarios en común.</p>
      <ul class="timeline"><li><span class="tl-ico badge t-brand" style="padding:0;justify-content:center">${icon('building', 14)}</span><div><strong>Grupo Quillay</strong><div class="muted">2 empresas</div></div></li><li><span class="tl-ico badge t-neutral" style="padding:0;justify-content:center">${icon('building', 14)}</span><div><strong>${c.name}</strong><div class="muted">${c.rut}</div></div></li></ul></div>`;
    else if (tab === 'cert') body = html`<div class="grid g2" style="max-width:960px"><div class="card card-pad stack"><h2>Certificado digital</h2>
        <dl style="display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0"><dt class="muted">Titular</dt><dd style="margin:0">${c.cert.holder}</dd><dt class="muted">RUT del titular</dt><dd style="margin:0">${U.rut(c.cert.holderRut)}</dd><dt class="muted">Vence</dt><dd style="margin:0">${U.date(c.cert.validUntil)} ${C.badge('En 54 días', 'warning')}</dd></dl>
        ${C.alert('warning', null, 'Hoy el sistema no extrae el RUT del titular (devuelve "UNKNOWN-RUT", RIESGOS R-10) y guarda el certificado y su contraseña sin cifrar (R-01).')}
        <div>${C.btn('Reemplazar certificado', { icon: 'upload', action: 'toast', attrs: 'data-msg="Certificado reemplazado."' })}</div></div>
      <div class="card card-pad stack"><h2>Ambiente del SII</h2><p class="muted">Define a qué servicio del SII se envían los documentos.</p>
        <label class="check"><input type="radio" name="env" value="cert" ${S.env === 'cert' ? raw('checked') : ''} data-action-change="set-env"><span><strong>Certificación</strong><br><span class="small muted">Pruebas. Los documentos no tienen validez tributaria.</span></span></label>
        <label class="check"><input type="radio" name="env" value="prod" ${S.env === 'prod' ? raw('checked') : ''} data-action-change="set-env"><span><strong>Producción</strong><br><span class="small muted">Documentos con validez tributaria; consumen folios reales.</span></span></label>
        ${C.alert('info', null, 'Hoy el sistema envía a producción por defecto y no hay configuración de certificación (RIESGOS R-05).')}</div></div>`;
    else if (tab === 'modules') body = html`<div class="card card-pad stack" style="max-width:640px"><h2>Módulos por rubro</h2><p class="muted">Activa solo lo que usa tu empresa. Los módulos desactivados no aparecen en el menú.</p>
      ${REG.MODULES.map(function (m) { return html`<div class="row-between" style="padding:6px 0;border-bottom:1px solid var(--border)"><label for="mod-${m[0]}">${m[1]}</label><span class="switch"><input type="checkbox" role="switch" id="mod-${m[0]}" value="${m[0]}" ${S.modules[m[0]] ? raw('checked') : ''} data-action-change="toggle-module"><span></span></span></div>`; })}
      ${C.alert('info', 'Propuesta nueva', 'No existe hoy un campo de módulos por empresa en el backend (PLAN B-10).')}</div>`;
    else body = html`<div class="card card-pad stack" style="max-width:640px"><h2>Notificaciones</h2>
      ${[['CAF por agotarse', true], ['Documento rechazado por el SII', true], ['Vencimientos tributarios', true], ['Certificado por vencer', true], ['Resumen semanal por email', false]].map(function (n, i) { return html`<div class="row-between" style="padding:6px 0;border-bottom:1px solid var(--border)"><label for="nt-${i}">${n[0]}</label><span class="switch"><input type="checkbox" role="switch" id="nt-${i}" ${n[1] ? raw('checked') : ''}><span></span></span></div>`; })}
      <div>${C.btn('Guardar preferencias', { variant: 'primary', action: 'toast', attrs: 'data-msg="Hoy esto falla: PUT /notifications/preferences no existe." data-tone="bad"' })}</div></div>`;
    return { title: 'Configuración', crumbs: [], subtitle: 'Empresa, usuarios, certificado, módulos y notificaciones.', endpoint: '/company/profile',
      body: html`${forceTab ? html`<div style="margin-bottom:12px">${C.alert('info', 'Esta dirección se unificó', 'El perfil de empresa era una pantalla duplicada. En el rediseño es la pestaña Empresa de Configuración.', C.btn('Ir a Configuración', { size: 'sm', href: '#/settings' }))}</div>` : ''}
        ${C.tabs('settings', [{ id: 'company', label: 'Empresa' }, { id: 'users', label: 'Usuarios y roles' }, { id: 'orgs', label: 'Organizaciones' }, { id: 'cert', label: 'Certificado y SII' }, { id: 'modules', label: 'Módulos' }, { id: 'notif', label: 'Notificaciones' }], tab)}${body}` };
  }
  V.settings = function (ctx) { return settingsView(ctx); };
  V['settings-company'] = function (ctx) { return settingsView(ctx, 'company'); };
  CH['set-env'] = function (el) { S.env = el.value; App.render(); App.toast(el.value === 'prod' ? 'Ambiente: producción. Los documentos tendrán validez tributaria.' : 'Ambiente: certificación.', el.value === 'prod' ? 'info' : 'ok'); };
  CH['user-role'] = function (el) { var u = D.users.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; u.role = el.value; App.toast('Rol de ' + u.name + ' cambiado a ' + REG.ROLE_LABEL[u.role] + '.'); };
  A['user-susp'] = function (el) { var u = D.users.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; u.status = u.status === 'Suspendido' ? 'Activo' : 'Suspendido'; App.render(); App.toast(u.name + ': ' + u.status.toLowerCase() + '.'); };
  A['user-del'] = function (el) { var u = D.users.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; App.confirm({ title: 'Eliminar a ' + u.name, text: 'Perderá el acceso de inmediato. Sus documentos y registros se conservan.', confirm: 'Eliminar usuario', destructive: true, icon: 'trash', onConfirm: function () { D.users.splice(D.users.indexOf(u), 1); App.render(); App.toast('Usuario eliminado.'); } }); };
  A['user-invite'] = function () { App.dialog({ title: 'Invitar usuario', body: html`<div class="stack">${C.field('Email', C.input('iv-e', '', { type: 'email', placeholder: 'nombre@empresa.cl' }), { id: 'iv-e', req: true })}${C.field('Rol', C.select('iv-r', REG.ROLES, 'ACCOUNTANT'), { id: 'iv-r', hint: 'Define qué áreas verá en el menú.' })}</div>`, actions: html`${C.btn('Cancelar', { action: 'dialog-close' })}${C.btn('Enviar invitación', { variant: 'primary', action: 'iv-send' })}` }); };
  A['iv-send'] = function () { App.closeDialog(); App.toast('Invitación enviada. Vence en 7 días.'); };

  // ======================= Notificaciones =======================
  V.notifications = function () {
    return { subtitle: 'Avisos del sistema sobre plazos, folios y documentos.', endpoint: '/notifications',
      actions: C.btn('Preferencias', { icon: 'settings', href: '#/settings?tab=notif' }),
      empty: { icon: 'bell', title: 'No tienes notificaciones', text: 'Te avisaremos aquí cuando un plazo se acerque o el SII responda.' },
      body: html`<div class="card">${D.notifications.map(function (n, i) { return html`<a href="${n.link}" class="row" style="padding:14px 16px;gap:12px;flex-wrap:nowrap;text-decoration:none;color:inherit;${i ? 'border-top:1px solid var(--border)' : ''}"><span class="badge t-${n.tone}" style="height:32px;width:32px;padding:0;justify-content:center;flex-shrink:0">${icon(n.icon, 16)}</span><span style="flex:1"><strong style="display:block">${n.title}</strong><span class="muted">${n.body}</span></span><span class="small muted nowrap">${U.dateTime(n.when)}</span></a>`; })}</div>` };
  };
})();

</script>
  <script>
/* Acceso (login, registro, invitación, onboarding), panel por rol y mapa del prototipo. */
(function () {
  'use strict';
  var U = window.U, C = window.C, D = window.D, REG = window.REG, html = U.html, icon = U.icon, raw = U.raw, V = window.V, A = window.A, CH = window.CH, S = window.S;

  // ======================= Login / registro / invitación =======================
  V.login = function () {
    var w = S.wiz.login = S.wiz.login || { email: 'mfuentes@quillayverde.cl', pass: '', err: null };
    return { body: html`<div class="card card-pad stack"><div><h1 tabindex="-1" id="page-title">Iniciar sesión</h1><p class="muted">Ingresa con tu email de trabajo.</p></div>
      ${w.err ? C.alert('destructive', null, w.err) : ''}
      <form class="stack" data-action-submit="login-go" novalidate>
        ${C.field('Email', C.input('lg-e', w.email, { type: 'email', attrs: 'autocomplete="username" data-bind="wiz.login.email"' }), { id: 'lg-e', req: true })}
        ${C.field('Contraseña', C.input('lg-p', '', { type: 'password', attrs: 'autocomplete="current-password" data-bind="wiz.login.pass"', err: w.err }), { id: 'lg-p', req: true, hint: 'Para el prototipo, cualquier contraseña de 4 caracteres o más.' })}
        ${C.btn('Ingresar', { variant: 'primary', type: 'submit', loading: App.isBusy('login'), loadingLabel: 'Ingresando…' })}
      </form>
      <p class="small muted">¿Tu empresa aún no usa el sistema? <a href="#/register">Crea una cuenta</a>. ¿Te invitaron? <a href="#/invite">Acepta la invitación</a>.</p></div>` };
  };
  A['login-go'] = function () {
    var w = S.wiz.login, p = document.getElementById('lg-p'); w.pass = p ? p.value : '';
    if (w.pass.length < 4) { w.err = 'El email o la contraseña no coinciden. Revisa e intenta de nuevo.'; App.render(); var f = document.getElementById('lg-p'); if (f) f.focus(); return; }
    w.err = null; App.busy('login', 700, function () { App.go(REG.homeFor(S.role)); });
  };
  V.register = function () {
    var w = S.wiz.reg = S.wiz.reg || { rut: '' };
    return { body: html`<div class="card card-pad stack"><div><h1 tabindex="-1" id="page-title">Crear cuenta</h1><p class="muted">Registra tu empresa. Después configuraremos el certificado y el SII.</p></div>
      <form class="stack" data-action-submit="reg-go" novalidate>
        ${C.rutField('rg-r', 'RUT de la empresa', w.rut, { req: true, attrs: 'data-bind="wiz.reg.rut" data-rerender' })}
        ${C.field('Razón social', C.input('rg-n', ''), { id: 'rg-n', req: true })}
        ${C.field('Tu nombre', C.input('rg-u', '', { attrs: 'autocomplete="name"' }), { id: 'rg-u', req: true })}
        ${C.field('Email', C.input('rg-e', '', { type: 'email', attrs: 'autocomplete="email"' }), { id: 'rg-e', req: true })}
        ${C.field('Contraseña', C.input('rg-p', '', { type: 'password', attrs: 'autocomplete="new-password"' }), { id: 'rg-p', req: true, hint: 'Al menos 10 caracteres.' })}
        ${C.btn('Crear cuenta', { variant: 'primary', type: 'submit' })}
      </form><p class="small muted">¿Ya tienes cuenta? <a href="#/login">Inicia sesión</a>.</p></div>` };
  };
  A['reg-go'] = function () { var r = S.wiz.reg; if (!U.validRut(r.rut)) { App.toast('Revisa el RUT de la empresa.', 'bad'); var f = document.getElementById('rg-r'); if (f) f.focus(); return; } App.go('/onboarding'); App.toast('Cuenta creada. Sigamos con la configuración.'); };
  V.invite = function () {
    return { body: html`<div class="card card-pad stack"><div><h1 tabindex="-1" id="page-title">Aceptar invitación</h1><p class="muted">${D.company.name} te invitó como <strong>Auditor</strong>.</p></div>
      ${C.alert('info', 'Planificado', 'El backend valida y registra invitaciones (/sso/invite/validate, /sso/register-invite), pero no hay pantalla.')}
      ${C.field('Email', C.input('in-e', 'rvergara@auditorasur.cl', { readonly: true }), { id: 'in-e' })}${C.field('Tu nombre', C.input('in-n', 'Rosa Vergara Cid'), { id: 'in-n', req: true })}${C.field('Crea una contraseña', C.input('in-p', '', { type: 'password' }), { id: 'in-p', req: true })}
      ${C.btn('Aceptar e ingresar', { variant: 'primary', action: 'inv-accept' })}<p class="small muted">La invitación vence el 22-11-2026.</p></div>` };
  };
  A['inv-accept'] = function () { S.role = 'AUDITOR'; App.go('/dashboard'); App.toast('Bienvenida. Tu rol es Auditor.'); };

  // ======================= Onboarding =======================
  var SUGGEST = { 'Comercio mayorista': ['b2b', 'wms'], 'Comercio minorista': ['pos'], Manufactura: ['mrp', 'wms'], Transporte: ['fleet'], Energía: ['energy', 'fleet', 'sustainability'], Servicios: [] };
  V.onboarding = function () {
    var w = S.wiz.onb = S.wiz.onb || { step: 0, rut: '76.481.205-0', name: D.company.name, giro: D.company.giro, industry: 'Comercio mayorista', cert: false, pass: '', env: 'cert', ai: true, mods: null, errors: {} };
    if (!w.mods) { w.mods = {}; REG.MODULES.forEach(function (m) { w.mods[m[0]] = (SUGGEST[w.industry] || []).indexOf(m[0]) >= 0; }); }
    var steps = [{ label: 'Empresa' }, { label: 'Certificado' }, { label: 'Preferencias' }];
    var body;
    if (w.step === 0) body = html`<div class="stack">
      ${C.rutField('ob-r', 'RUT de la empresa', w.rut, { req: true, attrs: 'data-bind="wiz.onb.rut" data-rerender' })}
      ${C.field('Razón social', C.input('ob-n', w.name, { attrs: 'data-bind="wiz.onb.name"' }), { id: 'ob-n', req: true })}
      ${C.field('Giro', C.input('ob-g', w.giro, { attrs: 'data-bind="wiz.onb.giro"' }), { id: 'ob-g', hint: 'Tal como aparece en el SII.' })}
      ${C.field('Industria', C.select('ob-i', Object.keys(SUGGEST), w.industry, { attrs: 'data-action-change="onb-ind"' }), { id: 'ob-i', hint: 'La usamos para sugerirte módulos.' })}</div>`;
    else if (w.step === 1) body = html`<div class="stack">
      <p class="muted">El certificado digital (.pfx o .p12) permite firmar los documentos que envías al SII. Lo entrega una entidad certificadora a nombre de una persona autorizada.</p>
      ${w.cert ? html`<div class="card card-pad stack-sm"><div class="row-between"><strong>certificado-vrojas.pfx</strong>${C.btn('Cambiar', { size: 'sm', variant: 'ghost', action: 'onb-cert-clear' })}</div>
          <dl style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0"><dt class="muted">Titular</dt><dd style="margin:0">${D.company.cert.holder}</dd><dt class="muted">RUT</dt><dd style="margin:0">${U.rut(D.company.cert.holderRut)}</dd><dt class="muted">Vence</dt><dd style="margin:0">${U.date(D.company.cert.validUntil)}</dd></dl></div>
        ${C.field('Contraseña del certificado', C.input('ob-p', w.pass, { type: 'password', attrs: 'data-bind="wiz.onb.pass" autocomplete="off"', err: w.errors.pass }), { id: 'ob-p', req: true, err: w.errors.pass })}
        ${C.alert('info', null, 'El certificado y su contraseña se guardarán cifrados. Hoy el sistema los guarda sin cifrar y no lee el RUT del titular (RIESGOS R-01, R-10).')}`
      : html`<label class="card card-pad" style="display:flex;flex-direction:column;align-items:center;gap:8px;border-style:dashed;cursor:pointer">${icon('key', 24)}<strong>Elegir certificado</strong><span class="small muted">Archivo .pfx o .p12</span><input type="file" accept=".pfx,.p12" class="sr-only" data-action-change="onb-cert"></label>
        <div class="row" style="justify-content:center">${C.btn('Usar certificado de ejemplo', { variant: 'link', action: 'onb-cert-sample' })}</div>
        <p class="small muted">Puedes hacerlo más tarde en Configuración, pero no podrás emitir documentos hasta cargarlo.</p>`}</div>`;
    else body = html`<div class="stack">
      <fieldset style="border:0;padding:0;margin:0" class="stack-sm"><legend class="label" style="margin-bottom:6px">Ambiente del SII</legend>
        <label class="check"><input type="radio" name="ob-env" value="cert" ${w.env === 'cert' ? raw('checked') : ''} data-bind="wiz.onb.env"><span><strong>Certificación (recomendado al empezar)</strong><br><span class="small muted">Para probar. Los documentos no tienen validez tributaria.</span></span></label>
        <label class="check"><input type="radio" name="ob-env" value="prod" ${w.env === 'prod' ? raw('checked') : ''} data-bind="wiz.onb.env"><span><strong>Producción</strong><br><span class="small muted">Documentos con validez tributaria.</span></span></label></fieldset>
      <fieldset style="border:0;padding:0;margin:0" class="stack-sm"><legend class="label" style="margin-bottom:6px">Módulos sugeridos para ${w.industry.toLowerCase()}</legend>
        ${REG.MODULES.map(function (m) { return html`<label class="check"><input type="checkbox" ${w.mods[m[0]] ? raw('checked') : ''} data-bind="wiz.onb.mods.${m[0]}">${m[1]}${(SUGGEST[w.industry] || []).indexOf(m[0]) >= 0 ? html` ${C.badge('Sugerido', 'brand')}` : ''}</label>`; })}</fieldset>
      <label class="check"><input type="checkbox" ${w.ai ? raw('checked') : ''} data-bind="wiz.onb.ai"><span><strong>Activar el asistente IA</strong><br><span class="small muted">Para responder, envía a un proveedor externo RUT, descripción, monto y fecha de los documentos consultados.</span></span></label>
    </div>`;
    if (w.step === 3) return { wide: false, body: html`<div class="card card-pad stack"><h1 tabindex="-1" id="page-title">Todo listo</h1><p class="muted">${w.name} quedó configurada en ambiente de ${w.env === 'cert' ? 'certificación' : 'producción'}. El siguiente paso es cargar tus folios (CAF) para emitir.</p>
      <div class="row">${C.btn('Cargar folios', { href: '#/sii/caf' })}${C.btn('Ir al panel', { variant: 'primary', href: '#/dashboard' })}</div></div>` };
    return { wide: true, body: html`<div class="card card-pad stack"><div><h1 tabindex="-1" id="page-title">Configura tu empresa</h1><p class="muted">Tres pasos. Puedes salir y retomar donde quedaste.</p></div>
      ${C.stepper(steps, w.step)}${body}
      <div class="row-between">${w.step ? C.btn('Atrás', { icon: 'chevLeft', action: 'onb-back' }) : html`<span></span>`}<div class="row">${w.step === 1 && !w.cert ? C.btn('Hacerlo más tarde', { variant: 'ghost', action: 'onb-skip' }) : ''}${C.btn(w.step < 2 ? 'Continuar' : 'Terminar', { variant: 'primary', action: 'onb-next' })}</div></div></div>` };
  };
  CH['onb-ind'] = function (el) { var w = S.wiz.onb; w.industry = el.value; w.mods = null; App.render(); };
  CH['onb-cert'] = function () { S.wiz.onb.cert = true; App.render(); };
  A['onb-cert-sample'] = function () { S.wiz.onb.cert = true; App.render(); };
  A['onb-cert-clear'] = function () { S.wiz.onb.cert = false; App.render(); };
  A['onb-back'] = function () { S.wiz.onb.step--; App.render(); };
  A['onb-skip'] = function () { S.wiz.onb.step = 2; App.render(); };
  A['onb-next'] = function () {
    var w = S.wiz.onb; w.errors = {};
    if (w.step === 0 && !U.validRut(w.rut)) { App.toast('Revisa el RUT de la empresa.', 'bad'); return; }
    if (w.step === 1 && w.cert && (w.pass || '').length < 4) { w.errors.pass = 'Ingresa la contraseña del certificado.'; App.render(); return; }
    if (w.step === 2) { S.env = w.env; REG.MODULES.forEach(function (m) { S.modules[m[0]] = !!w.mods[m[0]]; }); }
    w.step++; App.render();
  };

  // ======================= Panel por rol =======================
  function statusCounts() {
    var c = {}; D.invoices.forEach(function (i) { c[i.status] = (c[i.status] || 0) + 1; }); return c;
  }
  V.dashboard = function () {
    var role = REG.effectiveRole(S.role), u = REG.USERS_BY_ROLE[S.role][0].split(' ')[0];
    var f29 = window.F29, sc = statusCounts(), cs = D.cafs.filter(function (c) { return c.tipo === 33; }).reduce(function (s, c) { return s + (c.to - c.from + 1 - c.used); }, 0);
    var activity = [];
    D.invoices.forEach(function (i) { (i.history || []).forEach(function (h) { activity.push({ when: h[0], text: window.VENTAS.docName(i) + ': ' + h[2], href: '#/invoices/' + i.id, st: h[1] }); }); });
    activity.sort(function (a, b) { return a.when < b.when ? 1 : -1; });
    var docsCard = html`<div class="card"><div class="card-head"><h2>Documentos por estado</h2><span class="spacer"></span><a href="#/invoices" class="small">Ver todos</a></div><div class="card-body stack-sm">${Object.keys(C.DTE).map(function (k) { return html`<div class="row-between">${C.status(k)}<strong>${sc[k] || 0}</strong></div>`; })}</div></div>`;
    var activityCard = html`<div class="card"><div class="card-head"><h2>Actividad reciente</h2><span class="spacer"></span>${C.devTag({ dev: 'parcial', real: 'Con fallas', missing: 'Hoy la actividad reciente llama a GET /dashboard/recent-activity, que no existe. Aquí se arma con el historial de los documentos.', src: 'MAPA-FUNCIONAL.md §2.9, §4' })}</div><ol class="timeline card-body">${activity.slice(0, 5).map(function (a) { var d = C.DTE[a.st] || C.DTE.DRAFT; return html`<li><span class="tl-ico badge ${d.tone}" style="padding:0;justify-content:center">${icon(d.icon, 14)}</span><div><a href="${a.href}">${a.text}</a><div class="small muted">${U.dateTime(a.when)}</div></div></li>`; })}</ol></div>`;
    var deadlines = html`<div class="card"><div class="card-head"><h2>Próximos vencimientos</h2></div><div class="card-body stack-sm">
      ${[['20-11-2026', 'F29 de octubre', U.clp(f29.total), '#/accounting/f29'], ['13-12-2026', 'Cotizaciones previsionales (Previred)', U.clp(1642300), '#/payroll'], ['08-01-2027', 'Vence el certificado digital', '', '#/settings?tab=cert']].map(function (d) { return html`<a href="${d[3]}" class="deadline"><span class="row" style="gap:10px;flex-wrap:nowrap">${icon('calendar', 16)}<span><strong style="display:block">${d[1]}</strong><span class="small muted">${d[0]}</span></span></span><span class="money">${d[2]}</span></a>`; })}</div></div>`;
    var body;
    if (role === 'ADMIN' || role === 'ACCOUNTANT') body = html`<div class="stack">
      <div class="grid g4">${C.kpi('Ventas de octubre', U.clp(51800120), '+17% vs septiembre', { tone: 'up', ic: 'trending' })}${C.kpi('F29 de octubre a pagar', U.clp(f29.total), 'Vence el 20-11-2026', { ic: 'calendar' })}${C.kpi('Por cobrar', U.clp(18240600), '9 documentos')}${C.kpi('Folios de factura', U.int(cs), 'Alcanzan para unos 9 días', { tone: cs < 100 ? 'down' : '', ic: 'layers' })}</div>
      <div class="grid g-main"><div class="stack"><div class="card"><div class="card-head"><h2>Ventas y costos por mes</h2></div><div class="card-body">${C.barChart(D.salesSeries, [{ key: 'v', label: 'Ventas netas', color: '--chart-1' }, { key: 'c', label: 'Costos', color: '--chart-3' }], { unit: ' M', title: 'Ventas netas y costos por mes, en millones de pesos' })}</div></div>${activityCard}</div>
        <div class="stack">${deadlines}${docsCard}<div class="card card-pad stack-sm"><div class="row-between"><h3>Salud financiera</h3>${C.badge('Buena', 'success', 'shield')}</div><p class="muted">Liquidez de 3,15 veces y deuda de corto plazo bajo control.</p><a href="#/treasury" class="small">Ver flujo de caja</a></div></div></div></div>`;
    else if (role === 'SALES') body = html`<div class="stack"><div class="grid g4">${C.kpi('Ventas de noviembre', U.clp(23400000))}${C.kpi('Cotizaciones abiertas', String(D.quotes.filter(function (q) { return q.status === 'Enviada'; }).length))}${C.kpi('Oportunidades en curso', String(D.leads.filter(function (l) { return l.stage !== 'Ganado'; }).length))}${C.kpi('Documentos rechazados', String(sc.REJECTED || 0), 'Requieren corrección', { tone: 'down' })}</div>
      <div class="grid g-main">${activityCard}${docsCard}</div></div>`;
    else if (role === 'TREASURER') body = html`<div class="stack"><div class="grid g4">${C.kpi('Saldo en bancos', U.clp(61105750))}${C.kpi('Por cobrar a 30 días', U.clp(18240600))}${C.kpi('Por pagar a 30 días', U.clp(11870300))}${C.kpi('Movimientos sin conciliar', '2', null, { ic: 'merge' })}</div>
      <div class="grid g2">${C.alert('warning', 'Banco Litoral requiere reautorización', 'Sus movimientos no se sincronizan desde el 14-11-2026.', C.btn('Ir a Bancos', { size: 'sm', href: '#/banking' }))}${C.alert('info', '2 movimientos por conciliar', 'Una comisión y un depósito en efectivo.', C.btn('Conciliar', { size: 'sm', href: '#/banking/reconciliation' }))}</div></div>`;
    else {
      var cards = {
        OPERATIONS: [C.kpi('Productos bajo el mínimo', String(D.products.filter(function (p) { return p.stock < p.min; }).length), null, { tone: 'down', ic: 'alert' }), C.kpi('Órdenes de compra en camino', '1'), C.kpi('Picking pendiente', '2'), C.kpi('Cargadores con falla', '1')],
        HR: [C.kpi('Trabajadores', String(D.employees.length)), C.kpi('Líquido de octubre', U.clp(D.employees.reduce(function (s, e) { return s + e.liquido; }, 0))), C.kpi('Previred vence', '13-12-2026'), C.kpi('Liquidaciones por emitir', '0', null, { tone: 'up' })],
        AUDITOR: [C.kpi('Alertas abiertas', String(D.auditAlerts.length), null, { ic: 'alert' }), C.kpi('Diferencias con el SII', '3', 'Compras de octubre'), C.kpi('Documentos rechazados', String(sc.REJECTED || 0)), C.kpi('Último cierre', 'Septiembre 2026')]
      }[role] || [];
      body = html`<div class="stack">${C.alert('info', 'Panel para tu rol: propuesta nueva', 'Hoy el panel solo tiene datos para Administración, Contabilidad, Ventas y Tesorería (PLAN §3.2, decisión D-09).')}<div class="grid g4">${cards}</div></div>`;
    }
    return { title: 'Hola, ' + u, subtitle: 'Resumen de ' + D.company.name + ' al ' + U.date(D.TODAY) + '.', endpoint: '/dashboard/finance/metrics', body: body };
  };

  // ======================= Mapa del prototipo =======================
  V.mapa = function () {
    var list = REG.SCREENS.filter(function (s) { return s.dev; });
    var counts = {}; list.forEach(function (s) { counts[s.dev] = (counts[s.dev] || 0) + 1; });
    var inMapa = list.filter(function (s) { return /^§/.test(s.mapa || ''); });
    var areas = [];
    list.forEach(function (s) { if (areas.indexOf(s.area) < 0) areas.push(s.area); });
    var role = S.role;
    var backend = [
      ['POST /invoices (crear factura)', 'invoice-new'], ['/accounting/accounts, /ledger/{cuenta}, /opening-balance', 'accounts'], ['/periods/closed, /periods/{p}/status', 'close'],
      ['/reports/weekly/generate, /reports/balance-sheet', 'reports'], ['/audit/alerts, /duplicates, /suspicious, /reconciliation, /report', 'audit'], ['/sii/audit/report, /accounting/audit/sii-mirror', 'sii-audit'],
      ['/learning/rules (CRUD)', 'rules'], ['POST /accounting/cleanup/november-rcv (se retira)', 'ledger'], ['POST /sii/ops/fetch-rcv, /invoices/import/sii-csv', 'sii'],
      ['POST /annual-close/f22/calculate/{año}', 'annual-close'], ['/treasury/cash-flow-daily, /financial-ratios, /cash-entry', 'treasury'], ['/accounting/ledger/partners/{rut}/movements', 'partners'],
      ['/users/*, /roles/*', 'settings'], ['/organizations/*', 'settings'], ['PUT /sso/users/{id}/role', 'settings'], ['/sso/invite/validate, /register-invite', 'invite'],
      ['Inventario: crear, editar, eliminar, movimientos', 'inventory'], ['WMS: crear ubicación y picking', 'wms'], ['MRP: crear BOM y orden de trabajo', 'mrp'], ['POST /fixed-assets', 'assets'],
      ['/ai/knowledge', 'knowledge'], ['/dms/ai-invoicing/process', 'documents'], ['/notifications/subscribe, /preferences', 'notifications'], ['/sustainability/score', 'sustainability'],
      ['Energía: 70 endpoints (OCPP, precios, mantenimiento, reportes, alertas, modelos)', 'energy']
    ];
    var proposals = ['received', 'b2b-orders'];
    function rowFor(s) {
      var ok = REG.canAccess(s, role), off = s.module && !S.modules[s.module];
      var href = s.route.indexOf(':') >= 0 ? '#/invoices/f1024' : '#' + s.route;
      return html`<tr><td><a href="${href}" class="cell-main">${s.title}</a>${s.navParent ? html`<div class="cell-sub">Dentro de ${REG.BY_ID[s.navParent].title}</div>` : ''}</td>
        <td class="mono small">${s.route}</td><td class="mono small">${s.code || '—'}</td>
        <td>${C.devTag(s)}</td><td class="small">${s.mapa === 'backend' ? 'Backend sin pantalla (§6)' : s.mapa === 'propuesta' ? 'Propuesta nueva' : 'Pantalla ' + s.mapa}</td>
        <td class="small">${!ok ? html`<span class="muted">Sin acceso para ${REG.ROLE_LABEL[role]}</span>` : off ? html`<span class="muted">Módulo desactivado</span>` : html`<span class="up">Visible</span>`}</td></tr>`;
    }
    return {
      subtitle: 'Todas las pantallas del producto, con su estado real de desarrollo y un enlace a cada una.',
      body: html`<div class="stack">
        <div class="grid g4">${['disponible', 'parcial', 'desarrollo', 'planificado'].map(function (k) { return html`<div class="card kpi"><div class="k-label">${C.DEV[k].label}</div><div class="k-value">${counts[k] || 0}</div><div class="k-foot">${C.DEV[k].expl}</div></div>`; })}</div>
        ${C.alert('info', 'Cobertura', inMapa.length + ' de las 43 pantallas de MAPA-FUNCIONAL.md están en el prototipo, más ' + list.filter(function (s) { return s.mapa === 'backend'; }).length + ' funcionalidades del backend sin pantalla y ' + list.filter(function (s) { return s.mapa === 'propuesta'; }).length + ' propuestas nuevas. Pasa el cursor o el foco por cada etiqueta para ver qué falta.')}
        ${areas.map(function (a) {
          var rows = list.filter(function (s) { return s.area === a; });
          return html`<section class="map-area"><h2>${a} <span class="muted small">${rows.length}</span></h2><div class="card table-wrap"><table class="dt compact"><thead><tr><th scope="col">Pantalla</th><th scope="col">Ruta del prototipo</th><th scope="col">Ruta actual</th><th scope="col">Estado</th><th scope="col">Origen</th><th scope="col">Con el rol actual</th></tr></thead><tbody>${rows.map(rowFor)}</tbody></table></div></section>`;
        })}
        <section class="map-area"><h2>Funcionalidades del backend sin pantalla (MAPA-FUNCIONAL §6)</h2><div class="card table-wrap"><table class="dt compact"><thead><tr><th scope="col">Endpoints</th><th scope="col">Dónde aparecen en el prototipo</th></tr></thead><tbody>
          ${backend.map(function (b) { var s = REG.BY_ID[b[1]]; return html`<tr><td class="mono small">${b[0]}</td><td><a href="#${s.route.indexOf(':') >= 0 ? '/invoices/new' : s.route}">${s.title}</a></td></tr>`; })}
        </tbody></table></div></section>
        <section class="map-area"><h2>Componentes fuera de una ruta</h2><div class="card card-pad stack-sm">
          <div class="row-between"><span><strong>Asistente IA</strong> <span class="muted">(panel lateral en el encabezado, MAPA-FUNCIONAL §2.7)</span></span>${C.btn('Abrir asistente', { size: 'sm', icon: 'sparkles', action: 'ai-open' })}</div>
          <div class="row-between"><span><strong>Buscador de pantallas</strong> <span class="muted">(Ctrl + K, propuesta nueva)</span></span>${C.btn('Abrir buscador', { size: 'sm', icon: 'search', action: 'cmd-open' })}</div>
        </div></section>
      </div>`
    };
  };
})();

</script>
</body>
</html>
