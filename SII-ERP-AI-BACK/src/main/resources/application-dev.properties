# ==============================================================
# Perfil de DESARROLLO — application-dev.properties
# Nunca incluir este archivo en producción
# ==============================================================

# JPA: En desarrollo se puede usar update para agilizar el ciclo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable schema.sql initialization (tables already exist)
spring.sql.init.mode=never

# Logs verbosos solo en desarrollo
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.com.casrusil=DEBUG

# Actuator en dev: amplio para depurar, pero SIN endpoints peligrosos
# (se excluyen heapdump, threaddump, shutdown, env por posible fuga de secretos).
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,mappings,beans,conditions
management.endpoint.health.show-details=when_authorized

# JWT dev (cambiar en producción)
jwt.secret=${JWT_SECRET:EstaEsUnaClaveSecretaMuyLargaYSeguraParaDesarrolloLocal12345678}
jwt.expiration=86400000

# Certificado SII dev
sii.certificate.path=classpath:dummy.p12
sii.certificate.password=${SII_CERTIFICATE_PASSWORD:dummy_password_dev}

# Frontend URL para emails de invitación (dev)
app.frontend.url=http://localhost:3000

# CORS: Permitir frontend local
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
langchain4j.rag.enabled=true
