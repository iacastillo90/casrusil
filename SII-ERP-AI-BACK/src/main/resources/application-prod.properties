# Production Configuration (PostgreSQL)
# SEGURIDAD (R10): sin valores por defecto para credenciales; si faltan, el arranque falla.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sii_erp_ai}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# SEGURIDAD: En producción nunca usar 'update' o 'create'. Usar 'validate' + Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# RAG Configuration
langchain4j.rag.enabled=true

# Resilience (Inherited from default, but can be overridden here)
resilience4j.circuitbreaker.instances.sii.slidingWindowSize=${RESILIENCE4J_SLIDING_WINDOW_SIZE:20}

# JWT (produccion requiere un secret diferente y más largo)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Certificado SII
sii.certificate.path=${SII_CERTIFICATE_PATH}
sii.certificate.password=${SII_CERTIFICATE_PASSWORD}

# Endpoints y ambiente del SII: en producción se exige configuración explícita.
sii.ambiente=${SII_AMBIENTE}
sii.url.auth=${SII_URL_AUTH}
sii.url.upload=${SII_URL_UPLOAD}
sii.url.rcv=${SII_URL_RCV}
sii.caf.umbral-agotamiento=${SII_CAF_UMBRAL_AGOTAMIENTO:10}
# Consulta de estado del SII: sin defaults en producción (fail-fast).
sii.url.query-est-up=${SII_URL_QUERY_EST_UP}
sii.url.query-est-dte=${SII_URL_QUERY_EST_DTE}
sii.status.poll-enabled=${SII_STATUS_POLL_ENABLED}
sii.status.poll-interval-ms=${SII_STATUS_POLL_INTERVAL_MS}
sii.status.poll-initial-delay-ms=${SII_STATUS_POLL_INITIAL_DELAY_MS}
sii.status.max-attempts=${SII_STATUS_MAX_ATTEMPTS}
sii.estado.aceptados=${SII_ESTADO_ACEPTADOS}
sii.estado.aceptados-reparos=${SII_ESTADO_ACEPTADOS_REPAROS:}
sii.estado.rechazados=${SII_ESTADO_RECHAZADOS}
sii.estado.envio-procesado=${SII_ESTADO_ENVIO_PROCESADO}

# Actuator: exponer solo lo necesario, con detalle solo para autenticados
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# SEGURIDAD: en producción la cookie de sesión exige HTTPS.
security.cookie.secure=${SECURITY_COOKIE_SECURE:true}
security.cookie.same-site=${SECURITY_COOKIE_SAME_SITE:Strict}

# Logs: en prod, solo WARN para frameworks, INFO para app
logging.level.org.springframework=WARN
logging.level.com.casrusil=INFO

# Almacenamiento S3/MinIO: credenciales obligatorias en producción (sin admin/password123).
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}

# B04/B05: sin Redis, logout y rate limiter de login fallan cerrados (503) en producción.
security.redis.fail-closed=true

# Funcionalidades sin aislamiento por empresa: apagadas (ver P0 multiempresa).
app.features.energy-admin.enabled=false
app.features.legacy-user-admin.enabled=false

# Clave de cifrado en reposo (certificados). Obligatoria en producción.
app.crypto.key=${APP_CRYPTO_KEY}
