# Production Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sii_erp_ai}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# SEGURIDAD: En producción nunca usar 'update' o 'create'. Usar 'validate' + Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Resilience (Inherited from default, but can be overridden here)
resilience4j.circuitbreaker.instances.sii.slidingWindowSize=${RESILIENCE4J_SLIDING_WINDOW_SIZE:20}

# JWT (produccion requiere un secret diferente y más largo)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Certificado SII
sii.certificate.path=${SII_CERTIFICATE_PATH:classpath:dummy.p12}
sii.certificate.password=${SII_CERTIFICATE_PASSWORD}

# Actuator: exponer solo lo necesario, con detalle solo para autenticados
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Logs: en prod, solo WARN para frameworks, INFO para app
logging.level.org.springframework=WARN
logging.level.com.casrusil=INFO
