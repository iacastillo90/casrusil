# Propiedades comunes de tests (la base la aporta BaseIntegrationTest con Testcontainers)

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests (let Hibernate create schema) or enable if using migrations
spring.flyway.enabled=false

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.casrusil=DEBUG

# Allow Hibernate to create schemas used by entities during tests
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
