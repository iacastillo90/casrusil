version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: siierp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-siierpai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-siierpai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./SII-ERP-AI-BACK
      dockerfile: Dockerfile
    container_name: siierp_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-siierpai}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?Define DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET (openssl rand -base64 48)}
      - REDIS_HOST=${REDIS_HOST:-redis}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./SII-ERP-AI-FRONT
      dockerfile: Dockerfile
    container_name: siierp_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000" # Maps port 3000 to Next.js port 3000
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - BACKEND_INTERNAL_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
