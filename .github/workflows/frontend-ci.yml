name: Next.js CI/CD

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'SII-ERP-AI-FRONT/**'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './SII-ERP-AI-FRONT/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./SII-ERP-AI-FRONT
      run: npm ci
      
    - name: Build project
      working-directory: ./SII-ERP-AI-FRONT
      run: npm run build
      
    - name: Build Docker Image
      working-directory: ./SII-ERP-AI-FRONT
      run: docker build -t siierp-frontend:latest .
