name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'SII-ERP-AI-BACK/**'
      - 'SII-ERP-B2B-SERVICE/**'
  pull_request:
    branches: [ "main" ]

jobs:
  build-monolith:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Build with Gradle (SII-ERP-AI-BACK)
      working-directory: ./SII-ERP-AI-BACK
      run: |
        chmod +x gradlew
        ./gradlew build -x test

    - name: Build Docker Image
      working-directory: ./SII-ERP-AI-BACK
      run: docker build -t siierp-backend:latest .

  build-b2b:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Build with Gradle (B2B Microservice)
      working-directory: ./SII-ERP-B2B-SERVICE
      run: |
        chmod +x gradlew
        ./gradlew build -x test

    - name: Build Docker Image
      working-directory: ./SII-ERP-B2B-SERVICE
      run: docker build -t siierp-b2b:latest .
