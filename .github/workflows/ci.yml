name: CI

on:
  pull_request:
    branches: [integracion, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filtrar paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'SII-ERP-AI-BACK/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'SII-ERP-AI-FRONT/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (JDK 21 + Testcontainers)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # ubuntu-latest apunta a 26.04 (sin Docker disponible al 2026-11); 24.04 sí lo trae.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SII-ERP-AI-BACK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            SII-ERP-AI-BACK/**/*.gradle
            SII-ERP-AI-BACK/gradle/wrapper/gradle-wrapper.properties

      - name: Verificar Docker (Testcontainers)
        run: docker info

      - name: Permisos de Gradle
        run: chmod +x gradlew

      - name: Compilar y ejecutar tests
        run: ./gradlew clean compileJava compileTestJava test --console=plain

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            SII-ERP-AI-BACK/build/reports/tests/test
            SII-ERP-AI-BACK/build/test-results/test
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend (Node LTS + tsc + lint + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SII-ERP-AI-FRONT
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          # No hay .nvmrc ni engines en package.json: se fija la LTS 22.
          node-version: '22'
          cache: npm
          cache-dependency-path: SII-ERP-AI-FRONT/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
