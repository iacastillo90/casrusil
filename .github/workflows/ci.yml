name: CI

on:
  pull_request:
    branches: [integracion, main]
  push:
    branches: [integracion]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar cambios
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filtrar paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'SII-ERP-AI-BACK/**'
            frontend:
              - 'SII-ERP-AI-FRONT/**'

  backend:
    name: Backend (JDK 21 + Testcontainers)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true'
    # ubuntu-latest apunta a 26.04 (sin Docker disponible al 2026-11); 24.04 sí lo trae.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SII-ERP-AI-BACK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            SII-ERP-AI-BACK/**/*.gradle
            SII-ERP-AI-BACK/gradle/wrapper/gradle-wrapper.properties

      - name: Verificar Docker (Testcontainers)
        run: docker info

      - name: Permisos de Gradle
        run: chmod +x gradlew

      - name: Compilar y ejecutar tests
        run: ./gradlew clean compileJava compileTestJava test --console=plain

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            SII-ERP-AI-BACK/build/reports/tests/test
            SII-ERP-AI-BACK/build/test-results/test
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend (Node LTS + tsc + lint + build)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SII-ERP-AI-FRONT
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          # No hay .nvmrc ni engines en package.json: se fija la LTS 22.
          node-version: '22'
          cache: npm
          cache-dependency-path: SII-ERP-AI-FRONT/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: E2E (API + Playwright)
    # Pesado (Postgres + backend + front + navegador): no corre en PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/integracion')
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siierp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siierp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: siierp_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      OPENAI_API_KEY: dummy
      GEMINI_API_KEY: dummy
      GEMINI_MODEL_NAME: gemini-1.5-flash
      XAI_API_KEY: dummy
      MAIL_USERNAME: dummy@example.com
      MAIL_PASSWORD: dummy
      MINIO_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: e2e
      PGVECTOR_DIMENSION: '1536'
      CHAOS_MONKEY_ENABLED: 'false'
      OTLP_TRACING_ENDPOINT: http://localhost:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: '0.0'
      SII_CERTIFICATE_PASSWORD: dummy
      SII_CERTIFICATE_PATH: ''
      SPRING_REDIS_HOST: localhost
      SPRING_REDIS_PORT: '6379'
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            SII-ERP-AI-BACK/**/*.gradle
            SII-ERP-AI-BACK/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            SII-ERP-AI-FRONT/package-lock.json
            e2e/package-lock.json

      - name: Generar secreto JWT efímero
        run: |
          secret=$(openssl rand -hex 32)
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Levantar backend (8092)
        working-directory: SII-ERP-AI-BACK
        run: |
          chmod +x gradlew
          nohup ./gradlew bootRun --args="--server.port=8092" --console=plain > /tmp/backend-e2e.log 2>&1 &
          for i in {1..90}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8092/actuator/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Backend arriba (health $code)"
              exit 0
            fi
            sleep 5
          done
          echo "Backend no respondió"; tail -100 /tmp/backend-e2e.log; exit 1

      - name: Levantar frontend (3000)
        working-directory: SII-ERP-AI-FRONT
        run: |
          npm ci
          nohup env BACKEND_INTERNAL_URL=http://localhost:8092 npm run dev -- -p 3000 > /tmp/frontend-e2e.log 2>&1 &
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login || true)
            if [ "$code" = "200" ]; then
              echo "Frontend arriba"
              exit 0
            fi
            sleep 5
          done
          echo "Frontend no respondió"; tail -100 /tmp/frontend-e2e.log; exit 1

      - name: Instalar dependencias E2E
        working-directory: e2e
        run: npm ci

      - name: Matriz de permisos por API
        working-directory: e2e
        run: npm run api

      - name: E2E web (Playwright)
        working-directory: e2e
        run: npm run web

      - name: Publicar artefactos E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/api/report.md
            e2e/api/results.json
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Logs de backend/frontend si falla
        if: failure()
        run: |
          echo '--- backend ---'; tail -200 /tmp/backend-e2e.log || true
          echo '--- frontend ---'; tail -200 /tmp/frontend-e2e.log || true
